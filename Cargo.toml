[package]
name = "bevy-classic-factory-game-2"
edition = "2024"
version = "0.1.0"
authors = ["insufficientcharge <insufficientcharge@gmail.com>"]
license = "MIT OR Apache-2.0"
exclude = ["assets"]
repository = "https://github.com/insufficientcharge/bevy-classic-factory-game-2"
keywords = ["bevy", "game", "third person", "topdown", "gamedev"]

[dependencies.bevy]
version = "0.19"
default-features = false
features = [
    "bevy_settings",
    "3d",
    "ui",
    "scene",
    "serialize",
    "jpeg",
    "bevy_feathers",
    "bevy_material",
]

[dependencies]
bevy_asset_loader = "0.27.0"
bevy_perf_ui = { version = "0.7", optional = true }
bevy-inspector-egui = { version = "0.37", optional = true }
bevy_skein = "0.6"
bevy_rand = { version = "0.15", features = ["wyrand"] }
bevy_prng = { version = "0.15", features = ["wyrand"] }

bevy_third_person_camera = { version = "0.4", optional = true }
bevy_top_down_camera = { version = "0.4", optional = true }

bevy_sprinkles = "0.3.0"
avian3d = { version = "0.7", default-features = false, features = ["parry-f32", "3d", "f32", "collider-from-mesh"] }
bevy_ahoy = { version = "0.2", default-features = false }
bevy_enhanced_input = { version = "0.26", features = ["serialize"] }

bevy_shuffle_bag = "0.6"
bevy_seedling = { version = "0.8", features = ["hrtf"] }
firewheel = "0.12"

# dialogue
bevy_yarnspinner = "0.9"

# misc
easy-ext = "1"
fundsp = "0.20"
image = "0.25.6"
ron = "0.10"
rand = "0.10"
serde = "1"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
winit = { version = "0.30", default-features = false }
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_warn"] }

# agent testing dependencies
serde_json = { version = "1.0", optional = true }
tracing-subscriber = { version = "0.3", features = ["json"], optional = true }
tracing-appender = { version = "0.2", optional = true }

[features]
default = ["dev_native", "third_person"]
custom_cursor = []
fpv = []
top_down = ["bevy_top_down_camera"]
third_person = ["bevy_third_person_camera"]
native = ["enhanced"]
web = ["bevy/webgpu", "bevy_seedling/web_audio", "third_person"]
dev = [
    "bevy/debug",
    "bevy_perf_ui",
    "bevy/bevy_dev_tools",
    "bevy-inspector-egui",
    "bevy/bevy_ui_debug",
    "bevy/track_location",
]
dev_native = [
    "dev",
    "native",
    "bevy/dev",
    "custom_cursor",
    "bevy/bevy_remote",
    "bevy/embedded_watcher",
]
dynamic_linking = ["bevy/dynamic_linking"]
# Kept lightweight for dev and testing
enhanced = [
    "bevy/pbr_light_textures",
    "bevy/pbr_specular_textures",
]
# Opt-in for virtual geometry so it doesn't freeze standard dev/test builds
meshlets = [
    "bevy/meshlet",
    "bevy/meshlet_processor",
]
debug = [
    "bevy/trace_tracy",
    "bevy/debug",
]
agent_test = [
    "dep:serde_json",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
    "bevy/bevy_remote",
    "bevy/png",
]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
collapsible_if = "allow"
nonstandard_macro_braces = "warn"

[patch.crates-io]
bevy_seedling = { git = "https://github.com/CorvusPrudens/bevy_seedling", branch = "master" }
bevy_perf_ui = { git = "https://github.com/olekspickle/perf_ui" }
bevy_third_person_camera = { git = "https://github.com/olekspickle/bevy_third_person_camera" }

# Profiles optimized for fast iteration and tests
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1
debug = 1

[profile.test.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.test.package.wgpu-types]
debug-assertions = false

[profile.release]
lto = "thin"
opt-level = "s"
strip = true
codegen-units = 1